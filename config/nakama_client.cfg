; Crownspire Nakama client endpoint — BETA / LOCAL DEV
;
; Desktop uses host (loopback).
; Android / iOS use mobile_host (your PC LAN IP on the same Wi‑Fi).
; Update mobile_host when your LAN IP changes (ipconfig / ifconfig).
;
; Per-device override without rebuild: user://nakama_config.cfg
; Env: CROWNSPIR_NAKAMA_HOST / PORT / SCHEME / SERVER_KEY

[server]
host="127.0.0.1"
mobile_host="192.168.1.240"
port=7350
scheme="http"
server_key="defaultkey"

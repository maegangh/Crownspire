# Crownspire Nakama LOCAL DEVELOPMENT config only.
# Do NOT treat default keys as production-safe.
name: crownspire-local
data_dir: "./data/"

logger:
  level: "INFO"

console:
  port: 7351
  username: "admin"
  password: "password"
  # LOCAL DEVELOPMENT ONLY

session:
  token_expiry_sec: 7200
  # encryption keys remain Nakama defaults for local Docker only

socket:
  server_key: "defaultkey"
  # LOCAL DEVELOPMENT ONLY — never ship as production

runtime:
  js_entrypoint: "build/index.js"
  # LOCAL DEVELOPMENT ONLY
  http_key: "defaulthttpkey"
  # Optional closed-beta secure consumable grants (Peace Shield / Anti-Scout).
  # Default: DISABLED (RPC not registered). To enable on a server:
  #   env:
  #     - "CROWNSPIRE_ENABLE_BETA_GRANTS=true"
  #     - "CROWNSPIRE_BETA_GRANT_SECRET=<server-only-secret-min-16-chars>"
  # Never put CROWNSPIRE_BETA_GRANT_SECRET in Godot, APK, or client config.

metrics:
  reporting_freq_sec: 60

# Crownspire local Nakama stack — DEVELOPMENT ONLY
# Reuses existing Postgres volume: crownspire-nakama_crownspire_nakama_data
name: crownspire-nakama

services:
  postgres:
    container_name: crownspire-postgres
    image: postgres:12.2-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - crownspire_nakama_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    restart: unless-stopped

  nakama:
    container_name: crownspire-nakama
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address postgres:localdb@postgres:5432/nakama
        --name crownspire-local
        --logger.level INFO
        --session.token_expiry_sec 7200
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  crownspire_nakama_data:
    external: true
    name: crownspire-nakama_crownspire_nakama_data
